<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c8f0e1">
<title>말랑병원 🏥</title>
<style>
:root{
  --mint:#c8f0e1;--mint2:#9fe0c8;--mintD:#3fae8c;
  --pink:#ffe0e8;--pink2:#ffbfd0;--pinkD:#e9789b;
  --cream:#fff9ee;--line:#eadbcf;--lav:#ebe3ff;--lav2:#cfc0ff;--lemon:#fff2b8;
  --ink:#5b4a60;--muted:#9b8a9f;
  --red:#ff7f90;--yel:#ffcf5c;--grn:#6fd29a;
  --pz:clamp(20px,3.4vmin,34px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  background-image:radial-gradient(circle at 8% 10%,#ffe9f0 0,transparent 35%),radial-gradient(circle at 92% 92%,#dff6ec 0,transparent 40%)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{height:100%;height:100dvh;display:flex;flex-direction:column}

/* HUD */
#hud{position:relative;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 10px;background:#fffdf8ee;border-bottom:2px solid var(--line)}
.logo{font-weight:900;font-size:1.05rem;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:2px 9px;font-size:.85rem;font-weight:700;white-space:nowrap}
.chip.g{background:var(--mint);border-color:var(--mint2);color:#2f7d66}
.chip.money b{color:#d08a1c}
.chip.money.neg b{color:#d2557a}
.chip.bump{animation:boing .35s}
.hud-mid{display:flex;align-items:center;gap:6px;flex:1;min-width:170px}
.clock{display:flex;align-items:center;gap:6px;flex:1;max-width:280px;font-weight:800;font-variant-numeric:tabular-nums}
.tbar{flex:1;height:10px;background:#f1e6d6;border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint2),var(--pink2));border-radius:99px}
.hud-r{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.speed{display:flex;background:#fff;border:2px solid var(--line);border-radius:99px;overflow:hidden}
.speed button{border:0;background:none;padding:3px 9px;font-size:.82rem;font-weight:800}
.speed button.on{background:var(--pink2)}
.ibtn{border:2px solid var(--line);background:#fff;border-radius:99px;width:34px;height:30px;font-size:.95rem;padding:0}
.saved{font-size:.8rem;opacity:0;transition:opacity .4s}
.saved.on{opacity:1}
#goalbar{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px;font-size:.88rem;min-height:34px;align-items:center}
.gchip{background:#fff;border:2px dashed var(--line);border-radius:99px;padding:3px 11px;font-weight:800;white-space:nowrap;box-shadow:0 2px 0 #f1e4d8}
.gchip.ok{border-style:solid;border-color:var(--mint2);background:var(--mint);color:#2f7d66}
.gchip.bad{border-style:solid;border-color:var(--pink2);background:var(--pink);color:#b44a6a}
.gchip.ev{background:var(--lemon);border:2px solid #ffe08a}
.gchip.combo{background:#fff0d9;border:2px solid #ffc98a;color:#c46a12;animation:boing .35s}

/* MAP */
#mapWrap{flex:1;min-height:0;overflow:auto;padding:4px 8px 10px;position:relative}
#mapWrap.coachpad{padding-bottom:120px}
#map{display:grid;gap:7px;min-height:100%;margin:0 auto}
.card{position:relative;border-radius:18px;background:#fff;border:2px solid var(--line);padding:5px 6px 6px;display:flex;flex-direction:column;min-width:0;min-height:0;box-shadow:0 3px 0 #0000000d;transition:box-shadow .2s,border-color .2s}
.ch{display:flex;align-items:center;gap:4px;font-size:clamp(11px,1.5vmin + 4px,15px);white-space:nowrap;overflow:hidden;flex:0 0 auto}
.ch b{overflow:hidden;text-overflow:ellipsis}
.ch .syms{margin-left:auto;letter-spacing:-1px}
.ch .syms.small,.ch .deco{margin-left:auto;font-size:.82em;color:var(--muted);letter-spacing:0}
.ch .deco{font-size:1em}
.cb{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.room1{gap:6%}
.c-ent{background:linear-gradient(180deg,#fff3d6,#fff)}
.c-wait{background:linear-gradient(180deg,#e6faf1,#f7fffb)}
.c-dept{background:linear-gradient(180deg,#ffecf2,#fff)}
.c-exam{background:linear-gradient(180deg,#efe9ff,#fff)}
.c-pharm{background:linear-gradient(180deg,#e0f6ec,#fff)}
.c-inj{background:linear-gradient(180deg,#e4f0ff,#fff)}
.c-ward{background:linear-gradient(180deg,#f1ebff,#fff)}
.c-cash{background:linear-gradient(180deg,#fff1c4,#fff)}
.c-rest{background:linear-gradient(180deg,#ffead8,#fff)}
.c-more,.card.locked{background:repeating-linear-gradient(45deg,#fbf5ea 0 10px,#f5ecdc 10px 20px);border-style:dashed;color:var(--muted);cursor:pointer}
.lk{margin:auto;text-align:center;font-size:.78rem;line-height:1.4;padding:4px}
.lk .big{font-size:1.5rem;display:block}
.welcome{position:absolute;left:4px;bottom:0;font-size:10px;color:#c9a46a}
.rest-empty{color:var(--muted);font-size:.8rem}
.staffs:not(:empty)+.rest-empty{display:none}
#map.selecting .card.target{border-color:var(--mintD);box-shadow:0 0 0 3px #3fae8c44}
.card.hover{border-color:var(--pinkD)!important;box-shadow:0 0 0 4px #e9789b66!important}
.card.hl{animation:hl 1s ease-in-out infinite;border-color:var(--pinkD)}
.card.boing{animation:cardBoing .3s}

/* 의자 / 슬롯 / 침대 */
.seats{display:flex;flex-wrap:wrap;gap:3px 5px;justify-content:center;align-content:center}
.seat{position:relative;width:calc(var(--pz)*1.6);height:calc(var(--pz)*2.2);display:flex;align-items:flex-end;justify-content:center}
.seat::before{content:"";position:absolute;left:8%;right:8%;bottom:3%;height:40%;background:#bfe9d8;border-radius:8px 8px 5px 5px;box-shadow:inset 0 -4px 0 #9fd8c2}
.seat::after{content:"";position:absolute;left:16%;right:16%;bottom:40%;height:26%;background:#d6f3e7;border-radius:8px 8px 0 0}
.queue{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-content:flex-start;width:100%;height:100%;padding-top:2px}
.slot{position:relative;width:calc(var(--pz)*2);height:calc(var(--pz)*2.7);border-radius:14px;background:#ffffffb8;border:2px dashed #f0c9d6;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;flex:0 0 auto}
.c-exam .slot{border-color:var(--lav2)}.c-pharm .slot{border-color:var(--mint2)}.c-inj .slot{border-color:#b9dcff}
.slot .lab{position:absolute;top:1px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted);white-space:nowrap}
.prog{position:absolute;left:6px;right:6px;bottom:3px;height:5px;background:#0000000f;border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--mintD);border-radius:9px}
.prog.chk i{background:var(--yel)}
.card.closed .slot::after{content:"☕ 휴식 중";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;background:#fff9;border-radius:12px}
.beds{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.bed{position:relative;width:calc(var(--pz)*2);height:calc(var(--pz)*2.5);border-radius:12px;background:#fff;border:2px solid var(--lav2);display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.bed::before{content:"";position:absolute;top:4px;left:18%;right:18%;height:20%;background:var(--lav);border-radius:8px}
.bed::after{content:"";position:absolute;bottom:0;left:0;right:0;height:36%;background:#dcd0ff;border-radius:0 0 10px 10px;opacity:.7}

/* 직원 */
.staffs{display:flex;gap:3px;align-items:flex-end}
.sb{position:relative;font-size:calc(var(--pz)*.85);line-height:1}
.sb i{position:absolute;right:-.3em;bottom:-.1em;font-size:.5em;font-style:normal}
.sb em{position:absolute;right:-.3em;top:-.5em;font-size:.5em;font-style:normal;animation:bob 1.2s infinite}
.sb.tired{filter:saturate(.5)}
.c-ent .staffs{position:absolute;right:0;bottom:0}
.c-wait .staffs{position:absolute;right:2px;bottom:0;z-index:3}
.c-rest .staffs{flex-wrap:wrap;justify-content:center}
.c-dept .sb,.c-pharm .sb{font-size:calc(var(--pz)*1.1)}

/* 쓰레기 */
.dirtL{position:absolute;inset:0;pointer-events:none;z-index:1}
.dirt{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--pz)*.7);pointer-events:auto;cursor:pointer;filter:drop-shadow(0 2px 0 #0002);animation:pop .3s}
.dirt.gone{animation:poof .4s forwards;pointer-events:none}

/* 환자 */
.pt{position:relative;width:calc(var(--pz)*1.55);height:calc(var(--pz)*2.15);z-index:2;touch-action:none;cursor:grab;flex:0 0 auto}
.pt-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pt.arrive .pt-in{animation:arrive .5s}
.pt-bub{background:#fff;border-radius:9px;padding:0 4px;font-size:calc(var(--pz)*.56);line-height:1.35;box-shadow:0 2px 0 #0001;border:1.5px solid #eadfe8;position:relative;margin-bottom:3px;white-space:nowrap}
.pt-bub::after{content:"";position:absolute;left:50%;top:100%;margin-left:-3px;border:3px solid transparent;border-top-color:#eadfe8}
.pt-bub:empty{visibility:hidden}
.pt-bub small{font-size:.72em;opacity:.85;margin-left:1px}
.pt-bub.dest{background:#fff6c9;border-color:#ffd66b;animation:bob .9s ease-in-out infinite}
.pt-bub.pay{background:#fff1c2;border-color:#f3c64f;animation:bob .9s ease-in-out infinite}
.pt-bub.mad{background:#ffe1e6;border-color:#ff9fb0}
.pt-body{font-size:var(--pz);line-height:1;position:relative}
.ani{display:inline-block}
.crown{position:absolute;top:-.45em;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:.5em}
.pt-urg{position:absolute;left:-.12em;top:-.04em;width:.36em;height:.36em;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 2px #0003}
.pt-urg.u0{background:var(--grn)}.pt-urg.u1{background:var(--yel)}.pt-urg.u2{background:var(--red);animation:blink .8s infinite}
.pt-hp{display:flex;align-items:center;gap:1px;width:100%;margin-top:2px}
.pt-hp b{font-size:9px;color:#ff6f8f;line-height:1}
.pt-hp span{flex:1;height:5px;background:#f3e3ea;border-radius:9px;overflow:hidden}
.pt-hp i{display:block;height:100%;width:100%;background:#ff9fb8;border-radius:9px;transition:width .2s}
.pt.mid .pt-hp i{background:#ffb86b}
.pt.low .pt-hp i{background:#ff5d73}
.pt.low .ani{animation:shiver .25s infinite}
.pt-say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#5b4a60;color:#fff;font-size:11px;padding:3px 7px;border-radius:9px;white-space:nowrap;z-index:5;pointer-events:none;opacity:0;transition:opacity .2s}
.pt-say.on{opacity:1}
.pt-body.boing{animation:boing .35s}
.pt.shake .pt-body{animation:shakeX .4s}
.pt.sel .pt-in{animation:bob .6s ease-in-out infinite}
.pt.sel .pt-body{filter:drop-shadow(0 0 3px #3fae8c) drop-shadow(0 0 2px #fff)}
.pt.dragging{opacity:.3}
.pt.bye,.pt.mad{pointer-events:none}
.pt.bye .pt-in{animation:bye .8s ease-in forwards}
.pt.mad .pt-in{animation:madOut .9s ease-in forwards}
.pt.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-75%) scale(1.25);opacity:.95}

/* UI 레이어 */
#pauseOv{position:fixed;inset:0;background:#fff9eecc;display:flex;align-items:center;justify-content:center;z-index:20;font-size:1.3rem;font-weight:900;flex-direction:column;gap:8px;cursor:pointer;text-align:center}
#pauseOv .big{font-size:3rem;animation:bob 1.4s infinite}
#coach{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(580px,calc(100% - 20px));background:#fff;border:3px solid var(--pink2);border-radius:26px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start;z-index:40;box-shadow:0 5px 0 #f3b9c9,0 14px 28px #e9789b33;animation:drop .4s cubic-bezier(.3,1.5,.5,1)}
#coach .who{font-size:2.2rem;line-height:1;width:54px;height:54px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;background:#ffeef3;box-shadow:inset 0 -5px 0 #0000000a}
#coach .txt{flex:1;font-size:1rem;line-height:1.55}
#coach .txt > b:first-child{color:#d9668b}
#coach .txt small{color:var(--muted)}
#coach .btns{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}
#toasts{position:fixed;left:50%;top:84px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;width:min(94vw,560px)}
.toast{--tb:#ffd6e0;--tbg:#fff0f4;position:relative;display:flex;align-items:center;gap:11px;max-width:100%;background:#fff;color:var(--ink);
  border:3px solid var(--tb);border-radius:24px;padding:7px 18px 7px 7px;font-weight:800;font-size:1rem;line-height:1.4;
  box-shadow:0 5px 0 var(--tb),0 12px 26px #5b4a6026;animation:toastIn .5s cubic-bezier(.3,1.6,.5,1),toastOut .4s 2.7s forwards}
.toast .ti{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.45rem;background:var(--tbg);box-shadow:inset 0 -4px 0 #0000000d}
.toast .tt{text-align:left}
.toast.combo{--tb:#ffc98a;--tbg:#fff1dc;font-size:1.2rem;color:#c46a12;background:linear-gradient(135deg,#fffaf0,#ffe9f0)}
.toast.combo::after{content:"✨";position:absolute;right:-10px;top:-12px;font-size:1.3rem;animation:bob .8s infinite}
.toast.vip{--tb:#ffd86b;--tbg:#fff4c7;background:linear-gradient(135deg,#fffdf2,#fff6d6)}
.toast.ev{--tb:#ffe08a;--tbg:#fff6d0}
.toast.bad{--tb:#ffb3c6;--tbg:#ffe3ea;background:#fff7f9}
.toast.lvl{--tb:#9fe0c8;--tbg:#dcf6ec;background:#f7fffb}
.float{font-size:1.35rem!important;-webkit-text-stroke:.5px #fff;text-shadow:0 2px 0 #fff,0 3px 0 #f5c77a,0 0 8px #fff!important}
.float{position:fixed;z-index:70;pointer-events:none;font-weight:900;color:#e0951c;font-size:1.1rem;text-shadow:0 2px 0 #fff,0 0 6px #fff;transform:translate(-50%,-50%);animation:floatUp 1.1s ease-out forwards;white-space:nowrap}
.float.s{font-size:.85rem;color:var(--mintD)}

/* 모달 */
.mback{position:fixed;inset:0;background:#5b4a6066;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:14px;z-index:95;animation:fade .2s}
.modal{background:linear-gradient(180deg,#fffaf3,#fff4ea);border:4px solid #fff;border-radius:30px;max-width:540px;width:100%;max-height:92vh;max-height:92dvh;overflow:auto;padding:22px 18px 18px;font-size:1rem;
  box-shadow:0 0 0 3px #ffd6e0,0 8px 0 3px #f3b9c9,0 22px 44px #5b4a6040;animation:drop .4s cubic-bezier(.3,1.5,.5,1)}
.modal.wide{max-width:680px}
.modal h2{margin:.05em 0 .35em;font-size:1.6rem;text-align:center;color:#d9668b;text-shadow:0 3px 0 #ffe0e8;font-weight:900}
.modal .sub{text-align:center;color:#9b8a9f;margin:0 0 12px;font-size:1rem;line-height:1.55;font-weight:600}
.btn{border-radius:99px;padding:.65em 1.3em;font-weight:900;background:#fff;border:3px solid #f1e4d8;box-shadow:0 4px 0 #f1e4d8;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #f1e4d8}
.btn.pri{background:linear-gradient(180deg,#ffc7d6,#ffadc3);border-color:#ff9fb8;box-shadow:0 4px 0 #e98aa6;color:#7a2f49}
.btn.mint{background:linear-gradient(180deg,#b6ecd8,#93dfc3);border-color:#7fd3b4;box-shadow:0 4px 0 #6cbf9f;color:#21614e}
.btn.big{font-size:1.15rem;padding:.75em 1.8em}
.btn:disabled{opacity:.45;cursor:default}
.brow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.box{background:#fff;border-radius:20px;padding:12px 15px;margin:10px 0;border:3px solid #f6e9dd;box-shadow:0 4px 0 #f1e2d4;line-height:1.65;font-size:1rem}
.box > b:first-child{color:#c4557a}
.box small{color:#9b8a9f;font-size:.88rem}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.row .plus{color:#2f9a74}.row .minus{color:#d2557a}
.row.tot{border-top:3px dotted #f1e2d4;margin-top:6px;padding-top:8px;font-size:1.12rem}
.stars{color:#f0b53a}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;vertical-align:-1px;border:2px solid #fff;box-shadow:0 0 0 1px #0002}
.dot.r{background:var(--red)}.dot.y{background:var(--yel)}.dot.g{background:var(--grn)}
.promo{font-size:4rem;text-align:center;animation:bob 1.2s infinite}

/* 상점 */
.modal.shop{max-width:800px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.shop-head{position:relative;padding:40px 18px 12px;text-align:center;background:linear-gradient(180deg,#fff,#fff7f1)}
.awning{position:absolute;left:0;right:0;top:0;height:22px;background:repeating-linear-gradient(90deg,#ffb3c6 0 28px,#fffdf8 28px 56px)}
.awning::after{content:"";position:absolute;left:0;right:0;top:100%;height:13px;
  background:radial-gradient(circle at 14px 0,#ffb3c6 13px,transparent 13.5px) 0 0/56px 13px repeat-x,radial-gradient(circle at 42px 0,#fffdf8 13px,transparent 13.5px) 0 0/56px 13px repeat-x;
  filter:drop-shadow(0 2px 0 #f0b2c3)}
.shop-title{font-size:1.75rem;font-weight:900;color:#e9789b;text-shadow:0 3px 0 #ffe0e8;letter-spacing:.03em}
.wallet{display:inline-flex;gap:6px;align-items:center;margin-top:6px;background:#fff7dc;border:3px solid #ffe08a;border-radius:99px;padding:3px 18px;font-size:1.15rem;font-weight:900;color:#c98512;box-shadow:0 4px 0 #f5d27a}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0 10px;padding:0 12px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:80px;padding:7px 12px 6px;font-size:.95rem;font-weight:900;color:#9b8a9f;
  border-radius:18px;border:3px solid #f1e4d8;background:#fff;box-shadow:0 4px 0 #f1e4d8;transition:transform .15s}
.tab span{font-size:1.55rem;line-height:1.1}
.tab.on{background:#ffeef3;border-color:#ffbfd0;box-shadow:0 4px 0 #f3a5ba;color:#c4557a;transform:translateY(-3px)}
.shop-body{overflow:auto;padding:6px 16px 14px;flex:1;min-height:0}
.shop-foot{padding:12px;border-top:3px dotted #f1e2d4;text-align:center;background:#fffaf4}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.t-pink{--tc:#ffeef3;--tc2:#ffd0dc;--td:#e06d93}
.t-mint{--tc:#e3f8ef;--tc2:#b8ead3;--td:#38a57f}
.t-lav{--tc:#f0ebff;--tc2:#d9ccff;--td:#8a6fd6}
.t-sky{--tc:#e6f2ff;--tc2:#c4defa;--td:#4a87cc}
.t-lemon{--tc:#fff7d9;--tc2:#ffe49a;--td:#d29a12}
.t-peach{--tc:#fff0e2;--tc2:#ffd2ad;--td:#e08446}
.sitem{position:relative;background:#fff;border-radius:24px;padding:18px 12px 12px;text-align:center;border:3px solid var(--tc2);box-shadow:0 5px 0 var(--tc2);
  display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .15s}
.sitem:hover{transform:translateY(-3px) rotate(-.4deg)}
.sitem.own{background:linear-gradient(180deg,#fff 30%,var(--tc))}
.sitem.dim .sicon{filter:grayscale(.55);opacity:.7}
.sicon{position:relative;width:72px;height:72px;border-radius:50%;background:var(--tc);display:grid;place-items:center;font-size:2.5rem;line-height:1;
  box-shadow:inset 0 -6px 0 #0000000a,0 0 0 4px #fff,0 0 0 6px var(--tc2);margin:4px 0 6px}
.sitem:hover .sicon{animation:boing .4s}
.sicon .rb{position:absolute;right:-6px;bottom:-4px;font-size:1rem;font-style:normal;background:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;box-shadow:0 2px 0 var(--tc2)}
.sname{font-size:1.12rem;font-weight:900;color:#5b4a60}

.coin{margin-right:3px}

/* ===== 건물 평면도: 방들이 복도로 이어진 한 화면 ===== */
#mapWrap{background:#cdeac0;background-image:radial-gradient(#b9dfa9 1.5px,transparent 2px),radial-gradient(#d9f0cf 1px,transparent 1.5px);background-size:22px 22px,13px 13px;background-position:0 0,7px 9px}
#map{position:relative;gap:14px;padding:14px;border:9px solid #bba48d;border-radius:12px;
  background:repeating-conic-gradient(#f5efe6 0 25%,#ece4d7 0 50%) 0 0/28px 28px;
  box-shadow:inset 0 0 0 2px #a68e76,0 9px 0 #9c856f,0 16px 28px #0000002e}
#map::before{content:"";position:absolute;left:-9px;top:34px;width:9px;height:64px;background:linear-gradient(90deg,#bfe4ff,#eaf7ff);box-shadow:inset 0 0 0 2px #8fb8d6}
.card{border-radius:4px;border:6px solid #e8d9c8;padding:16px 6px 6px;

  background:#efe7db;border-left:3px solid #b69a7d;border-right:3px solid #b69a7d}
.card[data-door=b]::after{bottom:-7px}
.card[data-door=t]::after{top:-7px;left:74%}
.ch{position:absolute;top:-13px;left:10px;max-width:calc(100% - 20px);z-index:4;background:#fffdf8;border:2px solid #cdb59b;border-radius:7px;
  padding:1px 7px;box-shadow:0 2px 0 #b9a088;font-size:clamp(10px,1.3vmin + 4px,13px)}
.ch .syms{margin-left:6px}
.ch .syms.small,.ch .deco{display:none}
.c-ent,.c-cash{background:repeating-linear-gradient(0deg,#e9dfd0 0 1px,transparent 1px 30px),repeating-linear-gradient(90deg,#e9dfd0 0 1px,transparent 1px 30px),linear-gradient(135deg,#fffdf8,#f7efe2)}
.c-wait{background:repeating-linear-gradient(0deg,#0000000c 0 1px,transparent 1px 24px),repeating-linear-gradient(90deg,#f3d9b4 0 46px,#e2c39a 46px 47px,#f6dfbd 47px 92px,#e2c39a 92px 93px)}
.c-dept,.c-pharm{background:repeating-linear-gradient(0deg,#d7ece5 0 1px,transparent 1px 26px),repeating-linear-gradient(90deg,#d7ece5 0 1px,transparent 1px 26px),#f6fcfa}
.c-exam{background:repeating-linear-gradient(0deg,#e1d9f3 0 1px,transparent 1px 26px),repeating-linear-gradient(90deg,#e1d9f3 0 1px,transparent 1px 26px),#faf8ff}
.c-inj{background:repeating-linear-gradient(0deg,#d6e6f6 0 1px,transparent 1px 26px),repeating-linear-gradient(90deg,#d6e6f6 0 1px,transparent 1px 26px),#f7fbff}
.c-ward{background:radial-gradient(#e0d6f4 1px,transparent 1.6px) 0 0/10px 10px,#f2ecfc}
.c-rest{background:repeating-linear-gradient(90deg,#e7c49a 0 34px,#d4ad80 34px 35px),#e7c49a}
.c-more,.card.locked{background:radial-gradient(#d3ccc1 1px,transparent 1.6px) 0 0/9px 9px,#e8e3db;border-style:solid;border-color:#ddd3c6;color:#8f8478}
/* 가구 */
.furn{position:absolute;pointer-events:none;z-index:0;line-height:1;font-size:calc(var(--pz)*.7)}
.f-tl{top:3px;left:4px}.f-tr{top:3px;right:4px}.f-bl{bottom:3px;left:4px}.f-br{bottom:3px;right:4px}
.f-t{top:2px;left:50%;transform:translateX(-50%)}.f-b{bottom:2px;left:50%;transform:translateX(-50%)}.f-r{right:3px;top:50%;transform:translateY(-50%)}
.desk{padding:4px 6px;background:linear-gradient(#ddb990,#c99f74);border-radius:5px;box-shadow:0 3px 0 #a9835c;font-size:calc(var(--pz)*.5);letter-spacing:2px}
.sink{background:#fff;border-radius:6px;padding:2px;box-shadow:0 0 0 2px #d3e6e1}
.counter{left:5%;right:5%;top:2px;height:22px;display:flex;align-items:center;justify-content:space-around;font-size:13px;
  background:linear-gradient(#f3dec3,#e2c4a0);border-radius:6px;box-shadow:0 3px 0 #c8a47c}
.has-counter .queue{padding-top:30px}
.mat{left:4px;bottom:16px;width:30%;height:14px;border-radius:4px;background:repeating-linear-gradient(90deg,#c97b6b 0 4px,#d68f80 4px 8px);opacity:.55}
.edoor{position:absolute;left:-6px;top:22px;width:6px;height:52px;background:linear-gradient(90deg,#bfe4ff,#eaf7ff);box-shadow:inset 0 0 0 1px #8fb8d6;z-index:3}
.rug{left:12%;right:12%;top:12%;bottom:12%;border-radius:999px;background:radial-gradient(#ffffff70,transparent 70%),#cdeee0;opacity:.6;box-shadow:inset 0 0 0 3px #ffffff80}
.tv{background:#3d3a4a;border-radius:4px;padding:1px 5px;box-shadow:0 2px 0 #00000030}
.shelf{left:6%;right:6%;top:0;height:20px;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:3px;
  background:#efe3d2;border-radius:3px;box-shadow:inset 0 -4px 0 #d6c3aa,0 2px 0 #c9b49b}
.has-shelf{padding-top:16px}
.lightbox{background:#e8f2ff;border-radius:4px;padding:2px 4px;box-shadow:0 0 0 2px #b8c9e3}
.cart{background:#e6ebf0;border-radius:5px;padding:3px 4px;box-shadow:0 3px 0 #b7c0ca;font-size:calc(var(--pz)*.45)}
.win{width:42%;height:7px;background:linear-gradient(90deg,#cfe9ff,#f2faff);box-shadow:0 0 0 2px #b7d3ea}
.sofa{font-size:calc(var(--pz)*1.3)}
/* 진료 의자 · 침대를 실제 가구처럼 */
.slot{border:0;border-radius:10px 10px 7px 7px;background:linear-gradient(180deg,#ffffff,#eef6f4);box-shadow:0 0 0 2px #cfe3de,0 4px 0 #b9d2cb}
.c-exam .slot{box-shadow:0 0 0 2px #d6cdee,0 4px 0 #c1b6e0}
.c-inj .slot{box-shadow:0 0 0 2px #c9dcf0,0 4px 0 #b3c9e2}
.c-pharm .slot{border-radius:8px;background:linear-gradient(180deg,#fff,#f3ece2);box-shadow:0 0 0 2px #e0cfb8,0 4px 0 #cbb698}
.bed{border:0;box-shadow:0 0 0 2px #cbbdf0,0 4px 0 #b7a7e2}
/* 그림자 · 걷기 */
.pt::before{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:6px;background:#00000024;border-radius:50%;z-index:-1}
.pt.walk .ani{animation:waddle .2s ease-in-out infinite alternate}
/* 특별한 환자 */
.pt.emerg .pt-body::after{content:"🚨";position:absolute;right:-.4em;top:-.4em;font-size:.5em;animation:blink .5s infinite}
.pt.emerg .pt-in{filter:drop-shadow(0 0 4px #ff5d73)}
.pt.emerg .pt-bub{border-color:#ff9fb0;background:#fff0f2}
.pt.emerg .pt-hp i{background:#ff5d73!important}
.pt.karen .pt-body::after{content:"🕶️";position:absolute;left:50%;top:.2em;transform:translateX(-50%);font-size:.5em;pointer-events:none}
.pt.tantrum .ani{animation:shiver .1s infinite}
.pt.tantrum .pt-in{filter:drop-shadow(0 0 5px #ff9a4d)}
.pt.tantrum::after{content:"💢";position:absolute;right:-8px;top:8px;font-size:calc(var(--pz)*.65);z-index:6;pointer-events:none;animation:boing .45s infinite}
.pt.tantrum{cursor:pointer}
.pt-bub.multi{background:#eef5ff;border-color:#a9c7ee}
/* 약국 창구 3개 + 대기 줄 */
.pharm-cb{flex-direction:column;justify-content:flex-start;gap:4px}
.pslots{display:flex;gap:5px;justify-content:center;flex:0 0 auto}
.c-pharm .slot{width:calc(var(--pz)*1.7);height:calc(var(--pz)*2.55)}
.c-pharm .staffs{position:absolute;left:2px;bottom:0;z-index:3}
.queue.pq{height:auto;flex:1;min-height:0;width:100%;padding:0 0 0 calc(var(--pz)*1.1);align-content:flex-start;gap:0 1px}
.queue.pq .pt{margin-right:calc(var(--pz)*-.25)}
/* 알림 바: 목표 칩 오른쪽 고정 자리 */
#infobar{display:flex;align-items:center;gap:8px;padding-right:10px;min-height:42px}
#infobar #goalbar{flex:1 1 auto;min-width:0}
#toasts{position:relative;left:auto;top:auto;transform:none;flex:0 1 520px;width:auto;min-width:240px;height:38px;display:block;z-index:auto;pointer-events:none;gap:0}
#toasts .toast{position:absolute;right:0;top:50%;max-width:100%;padding:3px 14px 3px 4px;gap:8px;font-size:.92rem;border-width:2px;border-radius:99px;
  box-shadow:0 3px 0 var(--tb);white-space:nowrap;transform:translateY(-50%);animation:tkIn .35s cubic-bezier(.3,1.5,.5,1) both}
#toasts .toast .ti{width:28px;height:28px;font-size:1rem}
#toasts .toast .tt{overflow:hidden;text-overflow:ellipsis}
#toasts .toast.old{animation:tkOut .3s forwards}
#toasts .toast.combo{font-size:.98rem}
#toasts .toast.combo::after{display:none}
#toasts .toast.emer{animation:tkIn .35s cubic-bezier(.3,1.5,.5,1) both,tkShake .45s .35s}
@keyframes tkIn{from{opacity:0;transform:translate(30px,-50%) scale(.9)}to{opacity:1;transform:translate(0,-50%)}}
@keyframes tkOut{from{opacity:1;transform:translate(0,-50%)}to{opacity:0;transform:translate(0,-120%)}}
@keyframes tkShake{20%,60%{transform:translate(-4px,-50%)}40%,80%{transform:translate(4px,-50%)}}
@media (max-width:760px){
  #infobar{flex-wrap:wrap;gap:0;padding:0 6px 3px 0}
  #toasts{flex:1 1 100%;min-width:0;height:34px;margin-left:6px}
  #toasts .toast{font-size:.82rem;left:0;right:auto}
}
.gbar{height:12px;background:#f1e6d6;border-radius:99px;overflow:hidden;margin:3px 0 8px}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,#9fe0c8,#6cc6a5);border-radius:99px}
.grow{display:flex;gap:5px;align-items:baseline;font-size:.95rem}
.sbuy.lockbtn{background:#fff;color:#8a6fd6;border:3px dashed #d9ccff;box-shadow:0 4px 0 #e6ddff;padding:7px}
.gchip.over{background:#eef0ff;border:2px solid #c9cdf5;color:#5960a8}
.clock.over{color:#5960a8}
.clock.over .tbar i{background:linear-gradient(90deg,#b8bdf0,#8f96e0)}
.toast.emer{--tb:#ff9fa8;--tbg:#ffe3e6;background:#fff8f8;animation:toastIn .5s cubic-bezier(.3,1.6,.5,1),shakeX .4s .5s,toastOut .4s 2.7s forwards}
.sb{filter:drop-shadow(0 2px 1px #0000002a)}

@keyframes waddle{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(7deg) translateY(-2px)}}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.2,.85)}60%{transform:scale(.92,1.1)}100%{transform:scale(1)}}
@keyframes cardBoing{40%{transform:scale(.97)}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px) rotate(-6deg)}}
@keyframes arrive{from{transform:translateY(16px);opacity:0}}
@keyframes bye{to{transform:translateY(-18px) scale(.8);opacity:0}}
@keyframes madOut{0%,40%{transform:translateX(0)}10%,30%{transform:translateX(-4px)}20%{transform:translateX(4px)}100%{transform:translateY(12px);opacity:0}}
@keyframes shakeX{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
@keyframes shiver{50%{transform:translateX(1px)}}
@keyframes blink{50%{transform:scale(1.25)}}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3)}}
@keyframes poof{to{transform:translate(-50%,-90%) scale(1.6);opacity:0}}
@keyframes hl{50%{box-shadow:0 0 0 5px #ffb3c6}}
@keyframes fade{from{opacity:0}}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
@keyframes toastIn{from{transform:translateY(-16px) scale(.7);opacity:0}}
@keyframes toastOut{to{transform:translateY(-8px);opacity:0}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-280%) scale(1)}}

/* ===== 하나로 이어진 오픈 플로어 + 차분한 색감 ===== */
body{background-image:radial-gradient(circle at 8% 10%,#fff3df 0,transparent 35%),radial-gradient(circle at 92% 92%,#e3f4ec 0,transparent 40%)}
.speed button.on{background:var(--mint2)}
/* 바닥은 건물 전체에 한 장으로 깔림 */
#map{gap:0;padding:8px;
  background:repeating-linear-gradient(0deg,#e5dccf 0 1px,transparent 1px 44px),repeating-linear-gradient(90deg,#e5dccf 0 1px,transparent 1px 44px),linear-gradient(160deg,#fbf7f0,#f2eadf)}
#map .card{background:none;border:0;border-radius:0;box-shadow:none;padding:22px 12px 10px;color:inherit}
#map .card::before{content:"";position:absolute;inset:7px;border-radius:18px;z-index:0;pointer-events:none;background:var(--zone,transparent);transition:box-shadow .2s}
#map .card::after{content:none}
.edoor{display:none}
#map .lk{position:relative}
/* 구역별 바닥 */
#map .c-ent,#map .c-wait,#map .c-cash{--zone:repeating-linear-gradient(90deg,#f1dfc3 0 46px,#e6d0ae 46px 47px),#f1dfc3}
#map .c-ent::before,#map .c-wait::before,#map .c-cash::before{inset:0;border-radius:0}
#map .c-rest{--zone:repeating-linear-gradient(90deg,#f3dcc2 0 30px,#e9cdad 30px 31px),#f3dcc2}
#map .c-dept,#map .c-exam,#map .c-inj{--zone:repeating-linear-gradient(0deg,#d5ebe3 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,#d5ebe3 0 1px,transparent 1px 22px),#eef8f4}
#map .c-pharm{--zone:repeating-linear-gradient(0deg,#d6e5f3 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,#d6e5f3 0 1px,transparent 1px 22px),#f0f6fc}
#map .c-ward{--zone:radial-gradient(#ddd4ee 1px,transparent 1.6px) 0 0/10px 10px,#f1edf8}
#map .c-more,#map .card.locked{--zone:radial-gradient(#d6cfc4 1px,transparent 1.6px) 0 0/9px 9px,#ebe6de;color:#8f8478}
#map .c-more::before,#map .card.locked::before{box-shadow:inset 0 0 0 3px #e2d8ca;border:0}
/* 진료 공간: 뒤쪽만 막힌 낮은 칸막이 (복도 쪽은 열려 있음) */

  width:auto;max-width:none;transform:none;background:none;bottom:auto;
  border:5px solid #ddd0bf;border-bottom:0;border-radius:18px 18px 0 0;box-shadow:inset 0 3px 0 #ffffff80}
/* 표지판 */
#map .ch{top:0;left:16px;background:#fffdf8;border:2px solid #d8c6b0;box-shadow:0 2px 0 #cbb69c;color:#6b5848}

#map .card.hover::before{box-shadow:inset 0 0 0 4px #f0a35e!important}
#map .card.hl::before{animation:hlz 1s ease-in-out infinite}
@keyframes hlz{50%{box-shadow:inset 0 0 0 5px #ffc861}}
/* 팝업 · 알림 색 덜 핑크하게 */
#coach{border-color:#bfe3d3;box-shadow:0 5px 0 #a9d8c3,0 14px 28px #3fae8c22}
#coach .who{background:#e6f6ef}
#coach .txt > b:first-child{color:#3a9a7a}
.toast{--tb:#eadccb;--tbg:#fbf3e8}
.toast.combo{background:linear-gradient(135deg,#fffaf0,#fff1dc)}
.toast.bad{--tb:#f1c4c4;--tbg:#fde8e8;background:#fffafa}
.modal{box-shadow:0 0 0 3px #eadccb,0 8px 0 3px #d9c6ae,0 22px 44px #5b4a6033}
.modal h2{color:#6f5744;text-shadow:0 3px 0 #f1e4d3}

<div id="modalRoot"></div>
<script>
'use strict';
/* ===================== 데이터 ===================== */
const SAVE_KEY = 'mallang-hospital-v1', OPT_KEY = 'mallang-hospital-opt';
const ANIMALS = ['🐶','🐱','🐰','🐻','🐼','🦊','🐹','🐨'];
const ANAME = {'🐶':'멍멍','🐱':'냥냥','🐰':'토토','🐻':'곰곰','🐼':'판다','🦊':'여우','🐹':'햄찌','🐨':'코코'};
const DEPTS = {
  int:  { name:'내과',     icon:'🩺', fee:30, price:0,    grade:0, syms:[['🤒',1,'열'],['🤧',1,'감기'],['🤢',3,'배아픔']] },
  ort:  { name:'정형외과', icon:'🩼', fee:40, price:500,  grade:0, syms:[['🦴',1,'뼈 다침'],['🩹',4,'삐끗함']] },
  eye:  { name:'안과',     icon:'👓', fee:45, price:1200, grade:1, syms:[['👀',1,'눈 따가움']] },
  den:  { name:'치과',     icon:'🪥', fee:55, price:2000, grade:1, syms:[['🦷',1,'이 아픔']] },
  skin: { name:'피부과',   icon:'🧴', fee:50, price:3200, grade:2, syms:[['🔴',1,'두드러기']] },
  obgy: { name:'산부인과', icon:'👶', fee:60, price:4200, grade:2, syms:[['🤰',1,'임신 검진'],['🍼',1,'산후 검진']] },
};
const DEPT_ORDER = ['int','ort','eye','den','skin','obgy'];
const ROOMS = {
  ent:{name:'입구·접수',icon:'🚪'}, wait:{name:'대기실',icon:'🪑'}, cash:{name:'수납',icon:'💰'},
  pharm:{name:'약국',icon:'💊'}, inj:{name:'주사실',icon:'💉'}, exam:{name:'검사실',icon:'🩻'},
  ward:{name:'입원실',icon:'🛏️'}, rest:{name:'휴게실',icon:'☕'}, more:{name:'확장 예정',icon:'🏗️'},
};
for (const d of DEPT_ORDER) ROOMS[d] = { name:DEPTS[d].name, icon:DEPTS[d].icon };
const BUY_ROOMS = {
  exam:{ price:450, grade:0, desc:'❓ 원인 불명 환자의 진짜 증상을 알아내요 (🩻 X-ray · 💉 피검사)' },
  inj: { price:350, grade:0, desc:'진료 후 💉 주사 처방 환자를 받아요 (진료비 +20)' },
  rest:{ price:800, grade:1, desc:'지친 직원(💤)이 알아서 쉬고 돌아와요' },
};
const CLINIC_MUL = [1,1.25,1.5,1.8], CHAIRS = [4,6,8,10];
const UPS = {
  clinic:{ name:'진료실 장비', icon:'⚙️', prices:[400,900,1800], desc:l=>`진료 속도 ×${CLINIC_MUL[l]}` },
  wait:  { name:'대기실 의자', icon:'🪑', prices:[250,600,1200], desc:l=>`의자 ${CHAIRS[l]}개` },
  ward:  { name:'입원실 침대', icon:'🛏️', prices:[500,1100,2000], desc:l=>`침대 ${l+1}개` },
};
const DECOS = {
  plant:{ name:'화분',   icon:'🪴', price:120,  grade:0, eff:.07 },
  water:{ name:'정수기', icon:'🚰', price:250,  grade:0, eff:.07 },
  tv:   { name:'TV',     icon:'📺', price:450,  grade:1, eff:.08 },
  fish: { name:'어항',   icon:'🐠', price:700,  grade:1, eff:.08 },
  kids: { name:'키즈존', icon:'🧸', price:1000, grade:2, eff:.10 },
};
const GRADES = ['동네의원','병원','종합병원'];
const GRADE_TH = [{rep:55,total:50},{rep:75,total:200}];
const ROLE = {
  doctor: { t:'선생님', b:'🩺', n:'의사',   desc:'진료과 담당 · ⚡가 높을수록 진료가 빨라요' },
  nurse:  { t:'간호사', b:'📋', n:'간호사', desc:'입구 환자를 자동으로 접수해요' },
  pharm:  { t:'약사',   b:'💊', n:'약사',   desc:'약국 처리가 빨라져요' },
  janitor:{ t:'청소부', b:'🧹', n:'청소부', desc:'대기실 쓰레기를 치워요 · 위생 점검 대비' },
};
const DEST = { pharm:'💊', inj:'💉', ward:'🛏️' };
const EVENTS = {
  flu:     { icon:'🤧', name:'독감 시즌', desc:'오늘은 🤧 감기 환자가 엄청 많이 와요! 내과를 바쁘게 돌려 봐요.' },
  group:   { icon:'🚑', name:'단체 환자', desc:'오늘 중에 단체 환자가 한꺼번에 도착해요. 대기실을 비워 둬요!' },
  reporter:{ icon:'📰', name:'기자 방문', desc:'기자가 취재를 와요. 화난 환자 없이 만족도가 높으면 평판이 확 올라요!' },
  hygiene: { icon:'🧹', name:'위생 점검', desc:'오늘 위생 점검이 있어요. 청소부가 없으면 벌금이에요!' },
};
const LAYOUT = {
  wide: [
    ['ent wait wait cash','int ort exam pharm','inj ward ward more'],
    ['ent wait wait cash rest','int ort eye den pharm','exam inj ward ward more'],
    ['ent wait wait wait cash rest','int ort eye den skin pharm','exam obgy inj ward ward ward'],
  ],
  narrow: [
    ['ent wait wait','ent wait wait','int ort exam','inj pharm cash','ward ward more'],
    ['ent wait wait','ent wait wait','int ort eye','den exam inj','pharm cash rest','ward ward more'],
    ['ent wait wait','ent wait wait','int ort eye','den skin obgy','exam inj pharm','cash ward ward','rest ward ward'],
  ],
};
const ENT_CAP = 8, DAY_LEN = 180, SPAWN_END = 168;
const URG_DRAIN = [0.75, 1.0, 1.7];

/* ===================== 유틸 ===================== */
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const fmtN = n => Math.round(n).toLocaleString('ko-KR');
const wpick = arr => { let r = Math.random()*arr.reduce((a,x)=>a+x[1],0); for (const x of arr) { r -= x[1]; if (r <= 0) return x[0]; } return arr[arr.length-1][0]; };
// 받침 여부로 조사 고르기
const jo = (w,a,b) => { const c = w.charCodeAt(w.length-1); if (c < 0xAC00 || c > 0xD7A3) return w+b; return w + (((c-0xAC00)%28) ? a : b); };
const repStars = r => (r/20).toFixed(1);
const setT = (sel, v) => { const e = $(sel); if (e && e._t !== v) { e._t = v; e.textContent = v; } };
const setH = (el, h) => { if (el && el._h !== h) { el._h = h; el.innerHTML = h; } };

/* ===================== 효과음 (Web Audio) ===================== */
const OPT = (() => { try { return Object.assign({sound:true}, JSON.parse(localStorage.getItem(OPT_KEY)||'{}')); } catch(e) { return {sound:true}; } })();
function saveOpt() { try { localStorage.setItem(OPT_KEY, JSON.stringify(OPT)); } catch(e) {} }
let AC = null;
function tone(f, d=.1, type='sine', vol=.07, delay=0, slide=0) {
  if (!OPT.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t+d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.03);
  } catch(e) {}
}
const SFX = {
  tap:   () => tone(700,.06,'triangle',.05),
  reg:   () => { tone(523,.08,'triangle',.07); tone(784,.1,'triangle',.07,.07); },
  coin:  () => { tone(988,.07,'square',.035); tone(1319,.16,'square',.035,.07); },
  wrong: () => tone(300,.28,'triangle',.08,0,150),
  angry: () => { tone(220,.15,'sawtooth',.04,0,150); tone(160,.22,'sawtooth',.04,.13,100); },
  combo: () => [523,659,784,1047].forEach((f,i)=>tone(f,.12,'triangle',.07,i*.07)),
  lvl:   () => [659,880,1175].forEach((f,i)=>tone(f,.12,'sine',.08,i*.08)),
  done:  () => tone(880,.08,'sine',.05),
  day:   () => [392,523,659,784].forEach((f,i)=>tone(f,.18,'sine',.06,i*.12)),
  alert: () => { tone(880,.12,'square',.035); tone(660,.12,'square',.035,.15); },
  clean: () => tone(1200,.08,'sine',.05,0,1800),
  buy:   () => { tone(660,.08,'triangle',.07); tone(990,.14,'triangle',.07,.08); },
  siren: () => [0,1,2,3].forEach(i => tone(i%2 ? 660 : 960, .2, 'square', .035, i*.22)),
  calm:  () => tone(520 + Math.random()*200, .07, 'sine', .05),
};

/* ===================== 상태 ===================== */
let S = null; // 저장되는 상태
let G = null; // 하루 동안의 실행 상태

function newState() {
  const s = { v:1, day:1, money:300, rep:30, stars:0, grade:0, total:0,
    depts:{int:true}, rooms:{exam:false,inj:false,rest:false}, up:{clinic:0,wait:0,ward:0}, deco:{},
    staff:[], cands:[], candDay:0, tut:false, nextId:1 };
  S = s;
  s.staff.push(mkStaff('doctor', {dept:'int', animal:'🐻', spd:2, kind:2}));
  return s;
}
function newG() {
  return { mode:'idle', speed:1, modal:false, t:0, spawnT:2, pid:0, patients:[], dirt:[], dirtT:16,
    combo:0, maxCombo:0, stats:{treated:0,angry:0,income:0,vip:0,fine:0,wardN:0,wardIncome:0,wrong:0,emergOk:0,emergLost:0,karenCalm:0},
    goals:[], event:null, vipTimes:[], emergTimes:[], sel:null, tut:0, slots:{}, slotEls:{}, progEls:{}, seats:[], seatEls:[],
    entQ:null, cashQ:null, dirtL:null, warned:false, repStart:S?S.rep:0, moneyStart:S?S.money:0, shopTab:'dept', staffT:0 };
}
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); const e = $('#hSave'); e.classList.add('on'); setTimeout(()=>e.classList.remove('on'), 1200); } catch(e) {}
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.v === 1) return s; } catch(e) {}
  return null;
}

/* ===================== 직원 ===================== */
const wageOf = s => 12 + (s.spd + s.kind)*7 + (s.lvl-1)*3;
function mkStaff(role, o={}) {
  const s = { id:S.nextId++, role, dept:o.dept||null, animal:o.animal||pick(ANIMALS),
    spd:o.spd||rnd(1,3), kind:o.kind||rnd(1,3), lvl:1, xp:0, fat:0, rest:0, t:0 };
  s.wage = wageOf(s);
  return s;
}
const staffName = s => `${ANAME[s.animal]} ${ROLE[s.role].t}`;
const doctorOf = d => S.staff.find(s => s.role==='doctor' && s.dept===d);
const doctorReady = d => { const s = doctorOf(d); return !!s && !(s.rest > 0); };
const pharmacist = () => S.staff.find(s => s.role==='pharm' && !(s.rest > 0));
const capOf = role => role==='nurse' ? 1+S.grade : role==='janitor' ? (S.grade>=2?2:1) : 1;
const staffInfo = s => `${s.animal} ${staffName(s)} Lv.${s.lvl} · ⚡${s.spd} 😊${s.kind} · 피로 ${Math.round(s.fat)}%${s.rest>0?' (휴식 중 ☕)':''}`;

function work(s, f) {
  if (!s) return;
  s.fat = Math.min(100, s.fat + f);
  s.xp++;
  if (s.lvl < 10 && s.xp >= 4 + s.lvl*4) {
    s.xp = 0; s.lvl++;
    let up = '';
    if (s.spd < 5 && (s.spd <= s.kind || s.kind >= 5)) { s.spd++; up = '⚡속도 +1'; }
    else if (s.kind < 5) { s.kind++; up = '😊친절 +1'; }
    s.wage = wageOf(s);
    toast(`⬆️ ${staffName(s)} 레벨 업! Lv.${s.lvl} ${up}`, 'lvl'); SFX.lvl();
  }
}
function genCands() {
  const roles = ['nurse','doctor','pharm','janitor'];
  const list = [];
  if (!S.staff.some(s=>s.role==='nurse')) list.push('nurse');
  if (S.day >= 3 && !S.staff.some(s=>s.role==='janitor')) list.push('janitor');
  while (list.length < 3) list.push(pick(roles));
  const b = S.grade;
  S.cands = list.map(role => {
    const o = {};
    if (role==='doctor') o.dept = pick(DEPT_ORDER.filter(d=>S.depts[d]));
    o.spd = clamp(rnd(1,3) + (Math.random() < b*.35 ? 1 : 0), 1, 5);
    o.kind = clamp(rnd(1,3) + (Math.random() < b*.35 ? 1 : 0), 1, 5);
    return mkStaff(role, o);
  });
  S.candDay = S.day;
}

/* ===================== 계산 ===================== */
const availSyms = d => { const a = DEPTS[d].syms.filter(s => S.day >= s[1]).map(s=>s[0]); return a.length ? a : [DEPTS[d].syms[0][0]]; };
const isLocked = id => DEPTS[id] ? !S.depts[id] : BUY_ROOMS[id] ? !S.rooms[id] : false;
const prevOwned = id => { const i = DEPT_ORDER.indexOf(id); return i <= 0 || S.depts[DEPT_ORDER[i-1]]; };
function baseInterval() {
  const nd = DEPT_ORDER.filter(d=>S.depts[d]).length;
  // 완만한 곡선: 1일차 19초 → 날이 갈수록 조금씩 줄어 최대 -10초 (진료과·등급·평판이 늘면 조금 더 빨라짐)
  const dayCurve = 10 * (1 - Math.pow(.85, S.day-1));
  return clamp(19 - dayCurve - S.grade*1.2 - clamp(S.rep-30, 0, 50)*.02 - (nd-1)*.8, 4.5, 20);
}
// 날짜에 따라 0→1 로 천천히 오르는 난이도 값 (start일차에 시작, span일 동안 최대치까지)
const ramp = (start, span) => clamp((S.day - start + 1) / span, 0, 1);
const emergLimit = () => Math.round(38 - 10*ramp(3, 10)); // 응급 제한 시간: 38초 → 28초
function spawnInterval() {
  let iv = baseInterval();
  if (G.event && G.event.id==='flu') iv *= .78;
  return iv * (.7 + Math.random()*.6);
}
function hospitalMul() {
  const ks = S.staff.filter(s => !(s.rest > 0));
  const avgK = ks.length ? ks.reduce((a,s)=>a+s.kind,0)/ks.length : 1;
  let m = 1 - (avgK-1)*.06, d = 0;
  for (const k in DECOS) if (S.deco[k]) d += DECOS[k].eff;
  m *= (1 - d) * (1 + G.dirt.length*.06) * (.75 + .35*ramp(2, 14));
  return Math.max(.3, m);
}
function addMoney(n) { S.money += n; const c = $('#hMoneyC'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
function addRep(n) { S.rep = clamp(S.rep + n, 0, 100); }
function gradeProgress() {
  if (S.grade >= 2) return '최고 등급이에요! 👑';
  const th = GRADE_TH[S.grade];
  return `다음 등급 <b>${GRADES[S.grade+1]}</b>: ⭐ 평판 ${repStars(S.rep)}/${repStars(th.rep)} · 🐾 누적 환자 ${S.total}/${th.total}`;
}
function checkPromo() {
  if (S.grade >= 2) return false;
  const th = GRADE_TH[S.grade];
  if (S.rep >= th.rep && S.total >= th.total) { S.grade++; return true; }
  return false;
}

/* ===================== 목표 ===================== */
const goalReward = () => 60 + S.day*20;
function makeGoals() {
  const exp = SPAWN_END / baseInterval();
  const gs = [{ type:'treat', target:Math.max(5, Math.round(exp*.62)) }];
  if (S.day === 1) gs.push({ type:'angry', target:2 });
  else {
    const opts = ['angry','combo','money']; if (S.day >= 3) opts.push('vip');
    const t = pick(opts);
    if (t==='angry') gs.push({ type:t, target:Math.max(1, 3 - Math.floor(S.day/6)) });

}

}

    } else {

function updRooms(dt) {

    if (S.depts[id] || S.grade < d.grade || !prevOwned(id) || S.money < d.price) return;
    S.money -= d.price; S.depts[id] = true;
    const doc = mkStaff('doctor', {dept:id, spd:2, kind:rnd(1,2)}); S.staff.push(doc);
    msg = `${d.icon} ${d.name} 오픈! ${jo(staffName(doc),'이','가')} 왔어요`;
  } else if (kind === 'room') {
    const r = BUY_ROOMS[id];
    if (S.rooms[id] || S.grade < r.grade || S.money < r.price) return;
    S.money -= r.price; S.rooms[id] = true; msg = `${ROOMS[id].icon} ${ROOMS[id].name} 완성!`;
  } else if (kind === 'up') {
    const u = UPS[id], lv = S.up[id];
    if (lv >= 3 || S.money < u.prices[lv]) return;
    S.money -= u.prices[lv]; S.up[id]++; msg = `${u.icon} ${u.name} 업그레이드! ${'★'.repeat(S.up[id])}`;
  } else if (kind === 'deco') {
    const d = DECOS[id];
    if (S.deco[id] || S.grade < d.grade || S.money < d.price) return;
    S.money -= d.price; S.deco[id] = true; msg = `${d.icon} ${d.name} 설치! 대기실이 아늑해졌어요`;
  } else if (kind === 'hire') {
    const c = S.cands[+id]; if (!c || !hireCheck(c).ok) return;
    S.money -= c.wage*2;
    if (c.role === 'doctor') S.staff = S.staff.filter(s => !(s.role === 'doctor' && s.dept === c.dept));
    S.staff.push(c); S.cands.splice(+id, 1); msg = `${c.animal} ${staffName(c)} 입사! 잘 부탁해요 💕`;
  } else if (kind === 'fire') {
    const s = S.staff.find(x => x.id === +id); if (!s || s.role === 'doctor') return;
    S.staff = S.staff.filter(x => x !== s); msg = `${s.animal} ${jo(staffName(s),'과','와')} 작별했어요 👋`;
  }
  SFX.buy(); toast(msg); save(); buildMap(); applyLayout(); updateHUD(); showShop(G.shopTab);
}

/* ===================== 안내서 / 메뉴 ===================== */
function showGuide() {
  if (G.mode === 'play') G.modal = true;
  const rows = DEPT_ORDER.map(d => `${DEPTS[d].icon} <b>${DEPTS[d].name}</b>${S.depts[d] ? '' : ' 🔒'} : ${DEPTS[d].syms.map(s => `${s[0]} ${s[2]}`).join(', ')}`).join('<br>');
  openModal(`<h2>📖 말랑병원 안내서</h2>
    <div class="box"><b>증상 → 진료과</b><br>${rows}</div>
    <div class="box"><b>환자 표시</b><br>
      <span class="dot r"></span> 급함: 진료비 2배, 하트가 빨리 줄어요<br><span class="dot y"></span> 보통 · <span class="dot g"></span> 가벼움<br>
      👑 VIP: 팁이 두둑하지만 인내심이 짧아요<br>
      ❓ 원인 불명: 🩻 검사실에서 증상을 알아내거나, 아무 과에 보내서 50% 도박!<br>
      ♥ 하트가 다 닳으면 💢 화내고 떠나요 (평판 ↓)</div>
    <div class="box"><b>특별한 환자</b><br>
      🚨 응급 환자: 접수 없이 바로 와요. 정해진 시간(${emergLimit()}초) 안에 진료를 시작해야 해요! 진료 줄 맨 앞으로 들어가고 보상이 커요<br>
      🩺 복합 증상: 말풍선에 증상이 두 개! 진료과를 하나씩 차례로 들러요 (순서는 자유)<br>
      🕶️ 진상 환자: 가끔 소란을 피워 주변 하트를 깎고 새치기해요. 소란 중일 때 4번 톡톡 눌러 달래 주세요</div>
    <div class="box"><b>진료 후</b><br>💊 약국 · 💉 주사실 → 💰 수납<br>🛏️ 입원실: 하루가 끝나면 퇴원하며 큰 돈을 내요</div>
    <div class="box"><b>조작</b><br>톡: 접수 · 환자 선택 · 수납 / 끌기: 진료실 안내<br>환자 톡 → 방 톡으로도 안내돼요 · 쓰레기 🧻 톡: 청소<br>스페이스: 일시정지 · 1/2/4: 배속</div>
    <div class="brow"><button class="btn pri" data-act="guideClose">알겠어요!</button></div>`);
}
function closeGuide() { if (G.mode === 'prep') showPrep(); else { closeModal(); G.modal = false; } }
function showMenu() {
  if (G.mode === 'play') G.modal = true;
  openModal(`<h2>🏠 메인 화면으로 갈까요?</h2><p class="sub">${G.mode === 'play' ? '오늘 영업 기록은 저장되지 않아요.<br>(어제까지의 기록은 자동 저장되어 있어요 💾)' : '진행 상황은 자동 저장되어 있어요 💾'}</p>
    <div class="brow"><button class="btn" data-act="menuNo">계속하기</button><button class="btn pri" data-act="menuYes">메인으로</button></div>`);
}
function showTitle() {
  if (G) G.mode = 'menu';
  closeModal(); hideCoach(); $('#pauseOv').classList.add('hidden');
  $('#tCont').classList.toggle('hidden', !load());
  $('#tSound').textContent = OPT.sound ? '🔊 효과음 켜짐' : '🔇 효과음 꺼짐';
  $('#title').classList.remove('hidden');
}
function startGame(s) {
  S = s; $('#title').classList.add('hidden');
  mapEl.innerHTML = ''; clearToasts();
  prepDay();
}
function toggleSound() {
  OPT.sound = !OPT.sound; saveOpt();
  $('#bSound').textContent = OPT.sound ? '🔊' : '🔇';
  $('#tSound').textContent = OPT.sound ? '🔊 효과음 켜짐' : '🔇 효과음 꺼짐';
  SFX.tap();
}
function setSpeed(n) {
  if (!G) return;
  G.speed = n;
  if (n > 0 && G.mode === 'play' && OPT.speed !== n) { OPT.speed = n; saveOpt(); }
  document.querySelectorAll('.speed button').forEach(b => b.classList.toggle('on', +b.dataset.sp === n));
  $('#pauseOv').classList.toggle('hidden', !(n === 0 && G.mode === 'play'));
}

/* ===================== 입력 ===================== */
function act(a) {
  const i = a.indexOf(':'), k = i < 0 ? a : a.slice(0, i), v = i < 0 ? '' : a.slice(i+1);
  if (k !== 'buy') SFX.tap();
  switch (k) {
    case 'start': startDay(); break;
    case 'shop': showShop(v || 'dept'); break;
    case 'prep': showPrep(); break;
    case 'buy': buy(v); break;
    case 'grade': showGradeInfo(+v); break;
    case 'guide': showGuide(); break;
    case 'guideClose': closeGuide(); break;
    case 'sound': toggleSound(); showPrep(); break;
    case 'sumOk': nextDay(); break;
    case 'promoOk': prepDay(); break;
    case 'menuNo': closeModal(); G.modal = false; if (G.mode === 'prep') showPrep(); break;
    case 'menuYes': showTitle(); break;
    case 'newYes': closeModal(); try { localStorage.removeItem(SAVE_KEY); } catch(e) {} newState(); save(); startGame(S); break;
    case 'newNo': closeModal(); break;
    case 'endTut': endTut(); break;
    case 'skipTut': endTut(); break;
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) act(b.dataset.act);
});
const canAct = () => G && G.mode === 'play' && !G.modal && G.speed > 0;
function tapPatient(p) {
  if (!canAct()) return;
  bounce(p);
  if (p.tantrum) calmKaren(p);
  else if (p.stage === 'new') register(p);
  else if (p.stage === 'pay') pay(p);
  else if (['reg','queued','next'].includes(p.stage)) { if (G.sel === p) deselect(); else select(p); SFX.tap(); }
  else if (p.stage === 'svc') say(p, '치료받는 중이에요~', 1200);
  else if (p.stage === 'ward') say(p, '푹 쉬는 중 💤', 1200);
}
function tapRoom(id, c) {
  bounceEl(c);
  if (G.sel) { const p = G.sel; deselect(); sendTo(p, id); return; }
  if (id === 'cash') { const p = G.patients.find(x => x.stage === 'pay'); if (p) pay(p); else SFX.tap(); return; }
  if (isLocked(id) || id === 'more') { lockedInfo(id); return; }
  SFX.tap();
  if (DEPTS[id]) { const d = doctorOf(id); if (d) toast(staffInfo(d)); }
  else if (id === 'pharm') { const ph = S.staff.find(s => s.role === 'pharm'); toast(ph ? staffInfo(ph) : '💊 약사가 없어서 원장님이 천천히 약을 지어요. 약사를 고용해 봐요!'); }
  else if (id === 'ent') { const n = S.staff.filter(s => s.role === 'nurse'); toast(n.length ? n.map(staffInfo).join('<br>') : '📋 간호사를 고용하면 접수를 자동으로 해 줘요!'); }
  else if (id === 'wait') { const j = S.staff.filter(s => s.role === 'janitor'); toast(j.length ? j.map(staffInfo).join('<br>') : '🧻 쓰레기를 톡! 하면 치울 수 있어요. 청소부가 있으면 자동!'); }
}
mapEl.addEventListener('click', e => {
  if (e.target.closest('.pt')) return;
  if (!canAct()) return;
  const d = e.target.closest('.dirt'); if (d) { cleanDirt(d, false); return; }
  const c = e.target.closest('.card'); if (!c) { deselect(); return; }
  tapRoom(c.dataset.room, c);
});
// 드래그 앤 드롭 (마우스 + 터치)
let drag = null;
const cardAt = (x, y) => { const el = document.elementFromPoint(x, y); return el ? el.closest('#map .card') : null; };
mapEl.addEventListener('pointerdown', e => {
  const pe = e.target.closest('.pt'); if (!pe) return;
  const p = G.patients.find(x => x.id === +pe.dataset.id); if (!p) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  drag = { p, x0:e.clientX, y0:e.clientY, moved:false, ghost:null, hover:null, id:e.pointerId };
});
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moved) {
    if (dx*dx + dy*dy < 64) return;
    if (!canAct() || !['reg','queued','next'].includes(drag.p.stage)) return;
    drag.moved = true;
    const g = drag.p.el.cloneNode(true); g.classList.add('ghost'); g.classList.remove('sel', 'arrive');
    g.style.transform = ''; g.style.transition = ''; document.body.appendChild(g); drag.ghost = g;
    drag.p.el.classList.add('dragging'); markTargets(drag.p);
  }
  e.preventDefault();
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  const c = cardAt(e.clientX, e.clientY);
  if (c !== drag.hover) { if (drag.hover) drag.hover.classList.remove('hover'); drag.hover = c; if (c) c.classList.add('hover'); }
}, { passive:false });
function endDrag(d) {
  if (d.ghost) d.ghost.remove();
  if (d.hover) d.hover.classList.remove('hover');
  d.p.el.classList.remove('dragging');
  deselect();
}
addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (d.moved) { endDrag(d); const c = cardAt(e.clientX, e.clientY); if (c && d.p.stage !== 'gone' && canAct()) { bounceEl(c); sendTo(d.p, c.dataset.room); } }
  else tapPatient(d.p);
});
addEventListener('pointercancel', () => { if (drag) { if (drag.moved) endDrag(drag); drag = null; } });

document.querySelectorAll('.speed button').forEach(b => b.addEventListener('click', () => { if (G && G.mode === 'play') { setSpeed(+b.dataset.sp); SFX.tap(); } }));
$('#pauseOv').addEventListener('click', () => setSpeed(1));
$('#bSound').addEventListener('click', toggleSound);
$('#bGuide').addEventListener('click', () => { if (G && (G.mode === 'play' || G.mode === 'prep')) { SFX.tap(); showGuide(); } });
$('#bMenu').addEventListener('click', () => { if (G && G.mode !== 'menu') { SFX.tap(); showMenu(); } });
$('#tCont').addEventListener('click', () => { const s = load(); if (!s) return; SFX.tap(); startGame(Object.assign(newState(), s)); });
$('#tNew').addEventListener('click', () => {
  SFX.tap();
  if (load()) openModal(`<h2>✨ 새로 시작할까요?</h2><p class="sub">기존 병원 기록이 모두 지워져요.<br>정말 괜찮아요?</p><div class="brow"><button class="btn" data-act="newNo">아니요</button><button class="btn pri" data-act="newYes">새로 시작!</button></div>`);
  else act('newYes');
});
$('#tSound').addEventListener('click', toggleSound);
addEventListener('keydown', e => {
  if (!G || G.mode !== 'play' || G.modal) return;
  if (e.code === 'Space') { e.preventDefault(); setSpeed(G.speed === 0 ? 1 : 0); }
  else if (e.key === '1') setSpeed(1);
  else if (e.key === '2') setSpeed(2);
  else if (e.key === '4') setSpeed(4);
  else if (e.key === 'Escape') deselect();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.mode === 'play' && G.speed > 0 && !G.tut) setSpeed(0); });
let rsT = 0;
addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(applyLayout, 120); });

/* ===================== 시작 ===================== */
G = newG();
$('#bSound').textContent = OPT.sound ? '🔊' : '🔇';
showTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
